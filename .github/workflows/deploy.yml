name: CI

# Push to main runs the quality gate: lint, tests, typecheck, and a production
# build. Deployment is handled by:
#   - Frontend: AWS Amplify Hosting (connected to this repo; auto-builds on push via amplify.yml)
#   - Backend:  `npm run deploy` (AWS CDK) — run from a machine with AWS credentials
# This keeps CI secret-free and fast.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm --workspace web run build
